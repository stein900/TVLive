# Configuration TVLive (lue par les scripts shell ET par app.py)

# Port du serveur web (télécommande + écran TV)
PORT=5000

# Port DevTools local de Brave (pilotage des onglets, jamais exposé au réseau)
CDP_PORT=9222

# Profil Brave séparé (ne restaure jamais les onglets, pas de trousseau)
BRAVE_PROFILE_DIR=$HOME/.config/tvlive-brave

# Page d'accueil affichée sur la TV (par défaut : http://127.0.0.1:PORT/tv)
#TV_HOME_URL=http://127.0.0.1:5000/tv

# Commande de la session bureau classique, pour « Mode PC (une fois) ».
# Détection automatique si vide (cinnamon-session-cinnamon, startxfce4, mate-session…)
#DESKTOP_SESSION_CMD=cinnamon-session-cinnamon
