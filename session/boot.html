<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TVLive</title>
<style>
  html, body {
    height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden; cursor: none;
    font-family: "Inter", "Segoe UI", "Ubuntu", "Noto Sans", system-ui, sans-serif;
  }
  .wrap {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vh;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(229, 9, 20, 0.10), transparent 70%), #000;
  }
  .logo {
    font-size: 9vw; font-weight: 800; letter-spacing: -0.045em; line-height: 1;
    animation: pop 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    text-shadow: 0 0 6vw rgba(255, 255, 255, 0.08);
  }
  .logo span { color: #e50914; }
  .dots { display: flex; gap: 1vw; animation: fade 0.8s 0.6s both; }
  .dots i {
    width: 0.8vw; height: 0.8vw; border-radius: 50%; background: #fff; opacity: 0.2;
    animation: blink 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  .msg {
    position: fixed; bottom: 5vh; left: 0; right: 0; text-align: center;
    font-size: 1.1vw; color: #6b6b73; opacity: 0; transition: opacity 1s;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.92) translateY(1.5vh); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">TV<span>Live</span></div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <p class="msg" id="msg">Démarrage du serveur…</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var to = params.get("to") || "http://127.0.0.1:5000/tv";
      var origin;
      try { origin = new URL(to).origin; } catch (e) { origin = "http://127.0.0.1:5000"; }
      var t0 = Date.now();
      var MIN_SHOW = 1800;
      var tries = 0;
      var done = false;

      function go() {
        if (done) return;
        done = true;
        var wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
        setTimeout(function () { location.replace(to); }, wait);
      }

      function poll() {
        tries++;
        if (tries > 25) document.getElementById("msg").style.opacity = 1;
        fetch(origin + "/api/ping", { cache: "no-store", mode: "cors" })
          .then(function (r) { if (r.ok) go(); else setTimeout(poll, 500); })
          .catch(function () { setTimeout(poll, 500); });
      }
      poll();
    })();
  </script>
</body>
</html>
